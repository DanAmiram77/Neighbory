<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neighbory · השוק הקהילתי לבני נוער</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<nav class="nav">
    <div class="nav-logo" onclick="goHome()">
        <div class="logo-mark">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
        </div>
        <span class="logo-text">Neighbory</span>
    </div>
    <div class="nav-actions" id="nav-actions">
        <button class="btn btn-secondary" onclick="showLogin()">כניסה</button>
        <button class="btn btn-primary" onclick="showRegister()">הצטרפו 🚀</button>
    </div>
</nav>

<div id="main-content"></div>

<div id="modal-login" class="modal">
    <div class="modal-backdrop" onclick="closeModal('modal-login')"></div>
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal('modal-login')">×</button>
        <div class="modal-emoji">👋</div>
        <h2 class="modal-title">היי, ברוכים השבים!</h2>
        <p class="modal-sub">התחברו לחשבון שלכם</p>
        <form onsubmit="handleLogin(event)">
            <div class="field"><label>אימייל</label><input type="email" name="email" required placeholder="you@example.com"></div>
            <div class="field"><label>סיסמה</label><input type="password" name="password" required placeholder="••••••••"></div>
            <div id="login-error" class="error-msg"></div>
            <button type="submit" class="btn btn-primary btn-full btn-large">בואו ניכנס! 🚀</button>
        </form>
        <div class="modal-switch">אין לכם חשבון? <a onclick="showRegister()">הצטרפו עכשיו</a></div>
    </div>
</div>

<div id="modal-register" class="modal">
    <div class="modal-backdrop" onclick="closeModal('modal-register')"></div>
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal('modal-register')">×</button>
        <div class="tab-switch">
            <button class="tab active" onclick="switchTab('child')">🎒 אני ילד/ה</button>
            <button class="tab" onclick="switchTab('parent')">👨‍👩‍👧 אני הורה</button>
        </div>
        <div id="tab-child" class="tab-content active">
            <div class="modal-emoji">🎉</div>
            <h2 class="modal-title">מתחילים את ההרפתקה!</h2>
            <p class="modal-sub">לאחר ההרשמה, ההורה צריך לאשר את החשבון</p>
            <form onsubmit="handleChildRegister(event)">
                <div class="field-row">
                    <div class="field"><label>שם משתמש</label><input type="text" name="username" required minlength="3" placeholder="cooltrader"></div>
                    <div class="field"><label>גיל</label><input type="number" name="age" required min="13" max="18" placeholder="14"></div>
                </div>
                <div class="field"><label>שם מלא</label><input type="text" name="full_name" required minlength="2" placeholder="ישראל ישראלי"></div>
                <div class="field-row">
                    <div class="field"><label>אימייל</label><input type="email" name="email" required placeholder="you@example.com"></div>
                    <div class="field"><label>עיר</label><input type="text" name="city" required placeholder="תל אביב"></div>
                </div>
                <div class="field"><label>סיסמה</label><input type="password" name="password" required minlength="8" placeholder="לפחות 8 תווים"></div>
                <span class="divider-label">👨‍👩‍👧 פרטי ההורה</span>
                <div class="field-row">
                    <div class="field"><label>אימייל ההורה</label><input type="email" name="parent_email" required placeholder="parent@example.com"></div>
                    <div class="field"><label>טלפון ההורה</label><input type="tel" name="parent_phone" required minlength="9" placeholder="0501234567"></div>
                </div>
                <div id="register-child-error" class="error-msg"></div>
                <button type="submit" class="btn btn-primary btn-full btn-large">צרו לי חשבון! 🎯</button>
            </form>
        </div>
        <div id="tab-parent" class="tab-content">
            <div class="modal-emoji">👨‍👩‍👧</div>
            <h2 class="modal-title">הרשמה כהורה</h2>
            <p class="modal-sub">לפיקוח על חשבון ילדכם</p>
            <form onsubmit="handleParentRegister(event)">
                <div class="field"><label>שם מלא</label><input type="text" name="full_name" required minlength="2" placeholder="שם מלא"></div>
                <div class="field"><label>אימייל</label><input type="email" name="email" required placeholder="parent@example.com"></div>
                <div class="field"><label>טלפון</label><input type="tel" name="phone" required minlength="9" placeholder="0501234567"></div>
                <div class="field"><label>סיסמה</label><input type="password" name="password" required minlength="8" placeholder="לפחות 8 תווים"></div>
                <div id="register-parent-error" class="error-msg"></div>
                <button type="submit" class="btn btn-primary btn-full btn-large">הירשמו 👍</button>
            </form>
        </div>
        <div class="modal-switch">יש לכם חשבון? <a onclick="showLogin()">התחברו</a></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
